backend:
  name: git-gateway
  repo: mercyvideos/updated-mercyvideos
  branch: main
  identity_url: https://benevolent-tiramisu-650f1a.netlify.app/.netlify/identity
  gateway_url: https://benevolent-tiramisu-650f1a.netlify.app/.netlify/git/github

media_folder: "images/blog"
public_folder: "/images/blog"

site_url: https://mercyvideos.in
display_url: https://mercyvideos.in

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Keep it under 60 characters for best SEO" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Video Editing", value: "Video Editing" }
          - { label: "Audio Design", value: "Audio Design" }
          - { label: "Content Strategy", value: "Content Strategy" }
          - { label: "YouTube Growth", value: "YouTube Growth" }
          - { label: "Short Form", value: "Short Form" }
          - { label: "Behind The Scenes", value: "Behind The Scenes" }
      - { label: "SEO Description", name: "description", widget: "text", hint: "Write 150-160 characters. This shows on Google search results." }
      - { label: "Read Time (e.g. 5 min read)", name: "readtime", widget: "string", default: "5 min read" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Image Alt Text", name: "imagealt", widget: "string", required: false }
      - { label: "Blog Content", name: "body", widget: "markdown" } 